services:
  app:
    build: .
    container_name: hotel-ai-app
    ports:
      - "8000:8000"
    env_file:
      - .env.development
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    depends_on:
      - redis
      - chromadb
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: hotel-ai-web
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: hotel-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    container_name: hotel-ai-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: hotel-ai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=hotel_ai
      - POSTGRES_USER=hotel_user
      - POSTGRES_PASSWORD=hotel_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  chroma_data:
  postgres_data: